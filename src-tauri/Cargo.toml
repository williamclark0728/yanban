[package]
name = "yanban"
version = "0.8.1"
description = "研伴桌面版"
edition = "2021"
rust-version = "1.80"

[lib]
name = "yanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
dunce = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
portable-pty = "0.9.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
